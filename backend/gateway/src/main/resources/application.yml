spring:
  application:
    name: gateway

server:
  port: 8080

# Downstream target for routes. Reads USER_SERVICE_URI regardless of active profile
# (not gated behind application-{preprod,prod}.yml) so a missing/wrong
# SPRING_PROFILES_ACTIVE can't silently fall back to this localhost default while
# the env var is set and ignored.
gateway:
  user-service-uri: ${USER_SERVICE_URI:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # Same reasoning as gateway.user-service-uri above: read ZIPKIN_ENDPOINT regardless
  # of active profile, so a missing/wrong SPRING_PROFILES_ACTIVE can't silently fall
  # back to Micrometer's own built-in default instead of this (coincidentally
  # identical) localhost default while the env var is set and ignored.
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
