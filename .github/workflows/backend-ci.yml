name: Backend CI

# Runs the full test suite (unit + Testcontainers integration) for each backend
# service on pull requests that touch the backend. GitHub's ubuntu runners ship
# with Docker, so Testcontainers works without extra setup.
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One standalone Gradle build per service. Add new services here.
        service:
          - user-service
          - gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: backend/${{ matrix.service }}
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build/reports/tests/
          if-no-files-found: ignore
